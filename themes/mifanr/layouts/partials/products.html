{{ with site.Params.products }}
  <section id="works" class="section" aria-labelledby="works-title">
    <h2 id="works-title" class="section-title">作品</h2>
    <div class="works">
      {{ range . }}
        {{ $external := hasPrefix .url "http" }}
        <a
          class="work"
          href="{{ if $external }}{{ .url }}{{ else }}{{ .url | relURL }}{{ end }}"
          {{ if $external }}target="_blank" rel="noopener noreferrer"{{ end }}
        >
          {{ with .logo }}
            <img class="work-logo" src="{{ . | relURL }}" alt="" width="40" height="40">
          {{ else }}
            <span class="work-mark" aria-hidden="true">{{ substr .name 0 1 }}</span>
          {{ end }}
          <span class="work-body">
            <span class="work-name">{{ .name }}</span>
            {{ with .summary }}<span class="work-desc">{{ . }}</span>{{ end }}
          </span>
          <svg class="work-go" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 6.65c0 0 6.94-.54 7.92.43.97.98.43 7.92.43 7.92M16.5 7.5 6.5 17.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
          </svg>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
