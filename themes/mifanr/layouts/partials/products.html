{{ with site.Params.products }}
  <section class="section" aria-labelledby="products-title">
    <h2 id="products-title">我的作品</h2>
    <div class="product-list">
      {{ range . }}
        {{ $external := hasPrefix .url "http" }}
        <a
          class="product-card"
          href="{{ if $external }}{{ .url }}{{ else }}{{ .url | relURL }}{{ end }}"
          {{ if $external }}target="_blank" rel="noopener noreferrer"{{ end }}
        >
          <span class="product-icon" aria-hidden="true">
            {{ with .logo }}
              <img src="{{ . | relURL }}" alt="">
            {{ else }}
              {{ substr .name 0 1 }}
            {{ end }}
          </span>
          <span class="product-copy">
            <strong>{{ .name }}</strong>
            {{ with .summary }}<span>{{ . }}</span>{{ end }}
          </span>
          {{ with .note }}<span class="product-note">{{ . }}</span>{{ end }}
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
