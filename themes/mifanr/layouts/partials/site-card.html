{{- $name := .name -}}
{{- $url := .url -}}
{{- $logo := .logo -}}
{{- $external := ne (hasPrefix $url "/") true -}}
<a
  class="site-card js-hit"
  href="{{ $url }}"
  {{ if $external }}target="_blank" rel="noopener noreferrer"{{ end }}
  data-hit-id="{{ $url }}"
  data-hit-name="{{ $name }}"
  data-hit-url="{{ $url }}"
  {{ with $logo }}data-hit-logo="{{ . | relURL }}"{{ end }}
>
  <span class="site-icon" aria-hidden="true">
    {{ with $logo }}
      <img src="{{ . | relURL }}" alt="">
    {{ else }}
      {{ substr $name 0 1 }}
    {{ end }}
  </span>
  <span class="site-name">{{ $name }}</span>
</a>
