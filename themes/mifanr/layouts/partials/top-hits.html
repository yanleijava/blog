<section class="section" aria-labelledby="hits-title">
  <h2 id="hits-title">最常点击</h2>
  <div id="top-hits" class="site-grid">
    {{ range first 5 site.Params.sites }}
      {{ partial "site-card.html" . }}
    {{ else }}
      <p class="empty">点击常用网站或文章后，这里会显示最常打开的 5 项。</p>
    {{ end }}
  </div>
</section>
