{{ define "main" }}
  <header class="site-page-head">
    <h1 class="site-page-title">作品</h1>
    <p class="site-page-lead">正在做的产品与页面。</p>
  </header>
  <div class="work-cards">
    {{ range site.Params.products }}
      {{ $external := hasPrefix .url "http" }}
      <article class="work-card">
        <div class="work-card-head">
          {{ with .logo }}
            <img class="work-card-logo" src="{{ . | relURL }}" alt="" width="56" height="56">
          {{ else }}
            <span class="work-card-mark" aria-hidden="true">{{ substr .name 0 1 }}</span>
          {{ end }}
          <div>
            <h2 class="work-card-name">{{ .name }}</h2>
            {{ with .note }}<span class="work-card-sub">{{ . }}</span>{{ end }}
          </div>
        </div>
        {{ with .summary }}<p class="work-card-desc">{{ . }}</p>{{ end }}
        <div>
          <a class="cta" href="{{ if $external }}{{ .url }}{{ else }}{{ .url | relURL }}{{ end }}" {{ if $external }}target="_blank" rel="noopener noreferrer"{{ end }}>
            <span>访问 {{ .name }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6.65c0 0 6.94-.54 7.92.43.97.98.43 7.92.43 7.92M16.5 7.5 6.5 17.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
            </svg>
          </a>
        </div>
      </article>
    {{ end }}
  </div>
{{ end }}
