{{ define "main" }}
  <header class="site-page-title">{{ .Title }}</header>
  <ul class="posts">
    {{ range .Pages }}
      <li>
        <a class="post-link" href="{{ .RelPermalink }}">
          <span class="post-title">{{ .Title }}</span>
          <time class="post-date" datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format "2006-01-02" }}</time>
        </a>
      </li>
    {{ end }}
  </ul>
{{ end }}
