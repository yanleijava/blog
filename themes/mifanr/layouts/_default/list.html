{{ define "main" }}
  <header class="head">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="list">
    {{ range .Pages }}
      <li>
        <time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format (or site.Params.dateFormat "2006 年 1 月 2 日") }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Params.summary }}
          <p class="sum">{{ . }}</p>
        {{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
